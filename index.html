<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rep Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rep Log">
<meta name="theme-color" content="#F5F2FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23F5F2FB'/%3E%3Crect x='20' y='44' width='60' height='12' rx='5' fill='%233A3550'/%3E%3Crect x='10' y='36' width='10' height='28' rx='5' fill='%238FD9AE'/%3E%3Crect x='80' y='36' width='10' height='28' rx='5' fill='%238FD9AE'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23F5F2FB'/%3E%3Crect x='20' y='44' width='60' height='12' rx='5' fill='%233A3550'/%3E%3Crect x='10' y='36' width='10' height='28' rx='5' fill='%238FD9AE'/%3E%3Crect x='80' y='36' width='10' height='28' rx='5' fill='%238FD9AE'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F5F2FB;
    --panel:#FFFFFF;
    --panel2:#F1ECFA;
    --ink:#3A3550;
    --muted:#9C97B0;
    --accent:#8FD9AE;
    --on-accent:#1F5C3A;
    --accent-ink:#3E8F63;
    --danger:#F5A8A0;
    --up:#4FAE79;
    --down:#DD7C68;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --disp:'Nunito',-apple-system,system-ui,"Segoe UI",sans-serif;
    --shadow:0 1px 3px rgba(58,53,80,0.05),0 6px 18px rgba(58,53,80,0.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--disp);}
  body{padding-bottom:3rem;min-height:100vh;}
  .wrap{max-width:520px;margin:0 auto;padding:1.1rem 1rem calc(1rem + env(safe-area-inset-bottom));}
  h1{font-weight:800;letter-spacing:-0.01em;font-size:20px;margin:0.25rem 0 1.1rem;text-align:center;color:var(--ink);}
  .navrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:8px;}
  .navbtn{background:var(--panel);border:none;color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .navbtn:active{background:var(--panel2);}
  .datebox{flex:1;text-align:center;}
  .dateMain{font-size:16px;font-weight:800;}
  .dateSub{font-size:12px;color:var(--muted);}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.25rem;}
  .stat{background:var(--panel);border:none;border-radius:22px;padding:0.85rem 0.5rem;text-align:center;box-shadow:var(--shadow);}
  .stat .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;font-weight:700;}
  .stat .val{font-family:var(--disp);font-size:22px;font-weight:800;color:var(--ink);margin-top:3px;}
  input[type=text],input[type=number],select{
    background:var(--panel);border:none;color:var(--ink);
    border-radius:18px;padding:0.6rem 0.8rem;font-size:15px;font-family:var(--disp);width:100%;
    box-shadow:var(--shadow);
  }
  input[type=number]{font-family:var(--mono);}
  input:focus,select:focus{outline:none;box-shadow:0 0 0 2px var(--accent);}
  select{width:100px;flex-shrink:0;}
  .grouprow{display:flex;gap:6px;margin-bottom:8px;}
  .grouprow select{width:auto;flex:1;}
  .customrow{margin-bottom:8px;}
  .addrow{display:flex;gap:6px;margin-bottom:1.1rem;}
  .iconbtn{background:var(--accent);border:none;color:var(--on-accent);border-radius:18px;font-size:15px;font-weight:800;flex-shrink:0;box-shadow:var(--shadow);}
  .iconbtn:active{opacity:0.85;}
  .card{background:var(--panel);border:none;border-radius:24px;padding:0.95rem 1.1rem;margin-bottom:0.75rem;box-shadow:var(--shadow);}
  .cardhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.55rem;}
  .exname{font-weight:800;font-size:15px;}
  .extag{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;font-weight:700;}
  .lasttime{font-size:12px;color:var(--accent-ink);background:var(--panel2);border-radius:12px;padding:4px 10px;margin-top:6px;display:inline-block;font-family:var(--mono);}
  .delbtn{background:none;border:none;color:var(--muted);font-size:16px;padding:4px;}
  .setrow{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .setidx{font-family:var(--mono);color:var(--muted);width:16px;font-size:13px;}
  .setrow input[type=number]{width:82px;text-align:center;}
  .xmark{color:var(--muted);font-size:13px;}
  .rmset{margin-left:auto;background:none;border:none;color:var(--muted);font-size:15px;padding:4px 8px;}
  .plates{display:flex;align-items:center;gap:8px;margin:2px 0 8px 22px;min-height:0;}
  .barnub{width:14px;height:5px;background:var(--muted);border-radius:2px;}
  .platestack{display:flex;align-items:flex-end;gap:2px;}
  .plate{border-radius:4px;}
  .platelbl{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .addset{width:100%;background:var(--panel2);border:none;color:var(--accent-ink);border-radius:18px;padding:0.55rem;font-size:14px;margin-top:2px;font-weight:700;}
  .empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:14px;}
  .sectoggle{width:100%;background:none;border:none;border-top:1px solid rgba(58,53,80,0.08);color:var(--ink);padding:1rem 0 0.5rem;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;}
  .histrow{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:none;border-radius:18px;padding:0.65rem 0.9rem;margin-bottom:6px;font-size:13px;box-shadow:var(--shadow);cursor:pointer;}
  .histrow .l{font-weight:700;}
  .histrow .r{color:var(--muted);font-family:var(--mono);font-size:12px;}
  .progcard{background:var(--panel);border:none;border-radius:24px;padding:0.95rem 1.1rem;margin-bottom:8px;box-shadow:var(--shadow);}
  .progtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .progname{font-weight:800;font-size:14px;}
  .progdelta{font-family:var(--disp);font-size:14px;font-weight:800;}
  .progmeta{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono);}
  .err{box-shadow:0 0 0 2px var(--danger) !important;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Rep Log</h1>

  <div class="navrow">
    <button class="navbtn" id="prevDay" aria-label="Previous day">‹</button>
    <div class="datebox">
      <div class="dateMain" id="dateLabel"></div>
      <div class="dateSub" id="dateSub"></div>
    </div>
    <button class="navbtn" id="nextDay" aria-label="Next day">›</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="lbl">Exercises</div><div class="val" id="statEx">0</div></div>
    <div class="stat"><div class="lbl">Sets</div><div class="val" id="statSets">0</div></div>
    <div class="stat"><div class="lbl">Volume kg</div><div class="val" id="statVol">0</div></div>
  </div>

  <div class="grouprow">
    <select id="muscleGroup">
      <option value="push">Push</option>
      <option value="pull">Pull</option>
      <option value="leg">Leg</option>
      <option value="other">Other</option>
    </select>
    <select id="exerciseSelect"></select>
  </div>
  <div class="customrow" id="customRow" style="display:none;">
    <input type="text" id="exerciseInput" placeholder="Exercise name (custom)">
  </div>
  <div class="addrow">
    <select id="exerciseType">
      <option value="barbell">Barbell</option>
      <option value="dumbbell">Dumbbell</option>
      <option value="other">Other</option>
    </select>
    <button class="iconbtn" id="addExerciseBtn" style="flex:1;">+ Add exercise</button>
  </div>

  <div id="exerciseList"></div>
  <div class="empty" id="emptyState" style="display:none;">No exercises logged today. Add one above.</div>

  <button class="sectoggle" id="toggleProgress"><span>Progression</span><span id="progChevron">▾</span></button>
  <div id="progressList" style="display:none;margin-top:0.5rem;"></div>

  <button class="sectoggle" id="toggleHistory"><span>History</span><span id="histChevron">▾</span></button>
  <div id="historyList" style="display:none;margin-top:0.5rem;"></div>
</div>

<script>
(function(){
  var barWeightDefault = 20;
  var plateDenoms = [25,20,15,10,5,2.5,1.25];
  var plateColors = {25:'#F1A8A0',20:'#A8C8F0',15:'#F0D9A0',10:'#A8E0B8',5:'#F7F4EC',2.5:'#C9C4DC',1.25:'#DAD6E8'};
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var currentDate = todayStr();
  var currentSession = {exercises:[]};
  var historyLoaded = false;
  var progressLoaded = false;

  var muscleExercises = {
    push: [
      {name:'Bench Press', type:'barbell'},
      {name:'Incline Bench Press', type:'barbell'},
      {name:'Shoulder Press', type:'barbell'},
      {name:'Lateral Raise', type:'dumbbell'},
      {name:'Triceps Extension', type:'dumbbell'},
      {name:'Chest Dip', type:'other'}
    ],
    pull: [
      {name:'Pullup', type:'other'},
      {name:'Dumbbell Row', type:'dumbbell'},
      {name:'Biceps Curl', type:'dumbbell'},
      {name:'Hammer Curl', type:'dumbbell'}
    ],
    leg: [
      {name:'Squat', type:'barbell'},
      {name:'Deadlift', type:'barbell'},
      {name:'Romanian Deadlift', type:'barbell'},
      {name:'Leg Press', type:'other'},
      {name:'Lunge', type:'dumbbell'},
      {name:'Leg Curl', type:'other'},
      {name:'Calf Raise', type:'other'},
      {name:'Hip Thrust', type:'barbell'},
      {name:'Leg Raise', type:'other'}
    ],
    other: []
  };

  function populateExerciseSelect(){
    var group = document.getElementById('muscleGroup').value;
    var sel = document.getElementById('exerciseSelect');
    sel.innerHTML = '';
    muscleExercises[group].forEach(function(item){
      var opt = document.createElement('option');
      opt.value = item.name; opt.setAttribute('data-type', item.type);
      opt.textContent = item.name;
      sel.appendChild(opt);
    });
    var customOpt = document.createElement('option');
    customOpt.value = 'custom';
    customOpt.textContent = 'Other (custom)';
    sel.appendChild(customOpt);
    onExerciseSelectChange();
  }
  function onExerciseSelectChange(){
    var sel = document.getElementById('exerciseSelect');
    var customRow = document.getElementById('customRow');
    var typeSel = document.getElementById('exerciseType');
    if(sel.value === 'custom'){
      customRow.style.display = 'block';
    } else {
      customRow.style.display = 'none';
      var opt = sel.options[sel.selectedIndex];
      var t = opt ? opt.getAttribute('data-type') : null;
      if(t) typeSel.value = t;
    }
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function addDays(dateStr, delta){
    var parts = dateStr.split('-').map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate()+delta);
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function fmtLabel(dateStr){
    var today = todayStr();
    var yest = addDays(today,-1);
    var tmr = addDays(today,1);
    if(dateStr === today) return 'Today';
    if(dateStr === yest) return 'Yesterday';
    if(dateStr === tmr) return 'Tomorrow';
    var parts = dateStr.split('-').map(Number);
    return months[parts[1]-1] + ' ' + parts[2] + ', ' + parts[0];
  }
  function fmtSub(dateStr){
    var parts = dateStr.split('-').map(Number);
    return pad(parts[1])+'/'+pad(parts[2])+'/'+parts[0];
  }
  function round1(n){ return Math.round(n*10)/10; }

  function platesForSide(total, bar){
    var perSide = (total-bar)/2;
    if(perSide <= 0) return [];
    var remaining = perSide, result = [];
    for(var i=0;i<plateDenoms.length;i++){
      var p = plateDenoms[i], guard=0;
      while(remaining >= p-0.001 && guard<50){
        result.push(p); remaining -= p; guard++;
      }
    }
    return result;
  }
  function plateH(p){ return {25:60,20:60,15:54,10:48,5:36,2.5:26,1.25:20}[p]||20; }
  function plateW(p){ return {25:14,20:12,15:10,10:9,5:7,2.5:5,1.25:4}[p]||4; }

  function renderPlates(container, totalWeight){
    container.innerHTML = '';
    var plates = platesForSide(totalWeight, barWeightDefault);
    if(totalWeight < barWeightDefault+1 || plates.length===0){
      container.style.display='none'; return;
    }
    container.style.display='flex';
    var nub = document.createElement('div'); nub.className='barnub';
    var stack = document.createElement('div'); stack.className='platestack';
    plates.forEach(function(p){
      var el = document.createElement('div');
      el.className='plate';
      el.style.width=plateW(p)+'px';
      el.style.height=plateH(p)+'px';
      el.style.background=plateColors[p];
      if(p===5) el.style.border='1px solid #E5E1D8';
      stack.appendChild(el);
    });
    var lbl = document.createElement('div');
    lbl.className='platelbl';
    lbl.textContent = plates.join('+')+' kg/side';
    container.appendChild(nub);
    container.appendChild(stack);
    container.appendChild(lbl);
  }

  function computeStats(session){
    var exCount = session.exercises.length, setCount=0, volume=0;
    session.exercises.forEach(function(ex){
      ex.sets.forEach(function(s){
        if(s.weight>0 && s.reps>0){ setCount++; volume += s.weight*s.reps; }
      });
    });
    return {exCount:exCount, setCount:setCount, volume:round1(volume)};
  }
  function renderStats(){
    var st = computeStats(currentSession);
    document.getElementById('statEx').textContent = st.exCount;
    document.getElementById('statSets').textContent = st.setCount;
    document.getElementById('statVol').textContent = st.volume.toLocaleString();
  }
  function saveSession(){
    try{ localStorage.setItem('replog:'+currentDate, JSON.stringify(currentSession)); }
    catch(e){ console.error('save failed', e); }
  }

  function allSessionEntries(){
    var out = [];
    for(var i=0;i<localStorage.length;i++){
      var key = localStorage.key(i);
      if(key && key.indexOf('replog:')===0){
        var d = key.replace('replog:','');
        var sess = JSON.parse(localStorage.getItem(key));
        out.push({date:d, session:sess});
      }
    }
    return out;
  }

  function findLastOccurrence(exerciseName, beforeDate){
    var entries = allSessionEntries().filter(function(e){ return e.date < beforeDate; });
    entries.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    for(var i=0;i<entries.length;i++){
      var ex = entries[i].session.exercises.find(function(e){
        return e.name.toLowerCase() === exerciseName.toLowerCase();
      });
      if(ex){
        var validSets = ex.sets.filter(function(s){ return s.weight>0 && s.reps>0; });
        if(validSets.length>0){
          return {date:entries[i].date, sets:validSets};
        }
      }
    }
    return null;
  }

  function renderExercises(){
    var list = document.getElementById('exerciseList');
    var empty = document.getElementById('emptyState');
    list.innerHTML = '';
    empty.style.display = currentSession.exercises.length===0 ? 'block' : 'none';

    currentSession.exercises.forEach(function(ex, exIdx){
      var card = document.createElement('div'); card.className='card';
      var head = document.createElement('div'); head.className='cardhead';
      var titleWrap = document.createElement('div');
      var title = document.createElement('div'); title.className='exname'; title.textContent=ex.name;
      titleWrap.appendChild(title);
      if(ex.group){
        var tag = document.createElement('div'); tag.className='extag'; tag.textContent=ex.group;
        titleWrap.appendChild(tag);
      }
      var last = findLastOccurrence(ex.name, currentDate);
      if(last){
        var lt = document.createElement('div'); lt.className='lasttime';
        var setsStr = last.sets.map(function(s){ return s.weight+'×'+s.reps; }).join(', ');
        lt.textContent = 'Last (' + fmtLabel(last.date) + '): ' + setsStr;
        titleWrap.appendChild(lt);
      }
      var del = document.createElement('button'); del.className='delbtn'; del.setAttribute('aria-label','Remove exercise'); del.textContent='✕';
      del.addEventListener('click', function(){
        currentSession.exercises.splice(exIdx,1);
        saveSession(); renderExercises(); renderStats();
      });
      head.appendChild(titleWrap); head.appendChild(del); card.appendChild(head);

      ex.sets.forEach(function(s, setIdx){
        var row = document.createElement('div'); row.className='setrow';
        var idx = document.createElement('div'); idx.className='setidx'; idx.textContent=(setIdx+1);
        var w = document.createElement('input'); w.type='number'; w.step='0.5'; w.min='0'; w.placeholder='kg'; w.value=s.weight||'';
        var x = document.createElement('div'); x.className='xmark'; x.textContent='×';
        var r = document.createElement('input'); r.type='number'; r.min='0'; r.step='1'; r.placeholder='reps'; r.value=s.reps||'';
        var rm = document.createElement('button'); rm.className='rmset'; rm.setAttribute('aria-label','Remove set'); rm.textContent='—';

        var plateBox = document.createElement('div'); plateBox.className='plates';

        w.addEventListener('input', function(){
          var v=parseFloat(w.value); s.weight = isNaN(v)?0:v;
          saveSession(); renderStats();
          if(ex.type==='barbell') renderPlates(plateBox, s.weight||0);
        });
        r.addEventListener('input', function(){
          var v=parseInt(r.value,10); s.reps = isNaN(v)?0:v;
          saveSession(); renderStats();
        });
        rm.addEventListener('click', function(){
          ex.sets.splice(setIdx,1);
          saveSession(); renderExercises(); renderStats();
        });

        row.appendChild(idx); row.appendChild(w); row.appendChild(x); row.appendChild(r); row.appendChild(rm);
        card.appendChild(row);
        if(ex.type==='barbell'){
          card.appendChild(plateBox);
          renderPlates(plateBox, s.weight||0);
        }
      });

      var addSet = document.createElement('button'); addSet.className='addset'; addSet.textContent='+ Add set';
      addSet.addEventListener('click', function(){
        var lastSet = ex.sets[ex.sets.length-1];
        ex.sets.push({weight:lastSet?lastSet.weight:0, reps:lastSet?lastSet.reps:0});
        saveSession(); renderExercises(); renderStats();
      });
      card.appendChild(addSet);
      list.appendChild(card);
    });
  }

  function loadDate(d){
    currentDate = d;
    document.getElementById('dateLabel').textContent = fmtLabel(d);
    document.getElementById('dateSub').textContent = fmtSub(d);
    var raw = localStorage.getItem('replog:'+d);
    currentSession = raw ? JSON.parse(raw) : {exercises:[]};
    renderExercises(); renderStats();
  }

  document.getElementById('prevDay').addEventListener('click', function(){ loadDate(addDays(currentDate,-1)); });
  document.getElementById('nextDay').addEventListener('click', function(){ loadDate(addDays(currentDate,1)); });

  document.getElementById('muscleGroup').addEventListener('change', populateExerciseSelect);
  document.getElementById('exerciseSelect').addEventListener('change', onExerciseSelectChange);

  document.getElementById('addExerciseBtn').addEventListener('click', function(){
    var groupSel = document.getElementById('muscleGroup');
    var exSel = document.getElementById('exerciseSelect');
    var input = document.getElementById('exerciseInput');
    var typeSel = document.getElementById('exerciseType');
    var name;
    if(exSel.value === 'custom'){
      name = input.value.trim();
      if(!name){ input.classList.add('err'); return; }
      input.classList.remove('err');
    } else {
      name = exSel.value;
    }
    currentSession.exercises.push({name:name, type:typeSel.value, group:groupSel.value, sets:[{weight:0,reps:0}]});
    input.value='';
    saveSession(); renderExercises(); renderStats();
  });
  document.getElementById('exerciseInput').addEventListener('keydown', function(e){
    if(e.key==='Enter'){ document.getElementById('addExerciseBtn').click(); }
  });

  document.getElementById('toggleHistory').addEventListener('click', function(){
    var hl = document.getElementById('historyList');
    var chev = document.getElementById('histChevron');
    var showing = hl.style.display !== 'none';
    hl.style.display = showing ? 'none' : 'block';
    chev.textContent = showing ? '▾' : '▴';
    if(!showing && !historyLoaded){ loadHistory(); }
  });

  function loadHistory(){
    historyLoaded = true;
    var hl = document.getElementById('historyList');
    var items = allSessionEntries().map(function(e){
      return {date:e.date, stats:computeStats(e.session)};
    }).filter(function(it){ return it.stats.setCount>0; });
    items.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    hl.innerHTML='';
    if(items.length===0){
      hl.innerHTML = '<div style="color:var(--muted);font-size:13px;">No history yet.</div>';
      return;
    }
    items.forEach(function(it){
      var row = document.createElement('div'); row.className='histrow';
      var l = document.createElement('div'); l.className='l'; l.textContent=fmtLabel(it.date);
      var r = document.createElement('div'); r.className='r';
      r.textContent = it.stats.exCount+' exercises · '+it.stats.setCount+' sets · '+it.stats.volume.toLocaleString()+' kg';
      row.appendChild(l); row.appendChild(r);
      row.addEventListener('click', function(){ loadDate(it.date); });
      hl.appendChild(row);
    });
  }

  document.getElementById('toggleProgress').addEventListener('click', function(){
    var pl = document.getElementById('progressList');
    var chev = document.getElementById('progChevron');
    var showing = pl.style.display !== 'none';
    pl.style.display = showing ? 'none' : 'block';
    chev.textContent = showing ? '▾' : '▴';
    if(!showing){ loadProgress(); }
  });

  function sparklinePath(values, w, h){
    if(values.length<2) return {path:'', points:[]};
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if(min===max){ min -= 1; max += 1; }
    var pts = values.map(function(v, i){
      var x = (i/(values.length-1)) * (w-8) + 4;
      var y = h - 4 - ((v-min)/(max-min)) * (h-8);
      return [x,y];
    });
    var d = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
    return {path:d, points:pts};
  }

  function loadProgress(){
    progressLoaded = true;
    var pl = document.getElementById('progressList');
    var entries = allSessionEntries();
    entries.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var byExercise = {};
    entries.forEach(function(e){
      e.session.exercises.forEach(function(ex){
        var validSets = ex.sets.filter(function(s){ return s.weight>0 && s.reps>0; });
        if(validSets.length===0) return;
        var topSet = validSets.reduce(function(a,b){ return (a.weight>b.weight)?a:b; });
        var key = ex.name.toLowerCase();
        if(!byExercise[key]) byExercise[key] = {name:ex.name, group:ex.group, points:[]};
        byExercise[key].points.push({date:e.date, weight:topSet.weight, reps:topSet.reps});
      });
    });
    var names = Object.keys(byExercise).filter(function(k){ return byExercise[k].points.length>=2; });
    pl.innerHTML='';
    if(names.length===0){
      pl.innerHTML = '<div style="color:var(--muted);font-size:13px;">Log the same exercise on two or more days to see progression.</div>';
      return;
    }
    names.sort(function(a,b){ return byExercise[a].name.localeCompare(byExercise[b].name); });
    names.forEach(function(key){
      var item = byExercise[key];
      var pts = item.points.slice(-10);
      var weights = pts.map(function(p){ return p.weight; });
      var first = pts[0], lastPt = pts[pts.length-1];
      var delta = round1(lastPt.weight - first.weight);
      var card = document.createElement('div'); card.className='progcard';
      var top = document.createElement('div'); top.className='progtop';
      var nm = document.createElement('div'); nm.className='progname'; nm.textContent=item.name;
      var dl = document.createElement('div'); dl.className='progdelta';
      dl.style.color = delta>0 ? 'var(--up)' : (delta<0 ? 'var(--down)' : 'var(--muted)');
      dl.textContent = (delta>0?'+':'')+delta+' kg';
      top.appendChild(nm); top.appendChild(dl); card.appendChild(top);

      var svgW = 460, svgH = 48;
      var sp = sparklinePath(weights, svgW, svgH);
      var svgNs = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNs,'svg');
      svg.setAttribute('viewBox','0 0 '+svgW+' '+svgH);
      svg.setAttribute('width','100%'); svg.setAttribute('height',svgH);
      svg.style.display='block';
      if(sp.path){
        var path = document.createElementNS(svgNs,'path');
        path.setAttribute('d', sp.path);
        path.setAttribute('fill','none');
        path.setAttribute('stroke','#8FD9AE');
        path.setAttribute('stroke-width','2.5');
        svg.appendChild(path);
        sp.points.forEach(function(p, i){
          var c = document.createElementNS(svgNs,'circle');
          c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', i===sp.points.length-1?4:2.5);
          c.setAttribute('fill', i===sp.points.length-1?'#3E8F63':'#D3F0DE');
          svg.appendChild(c);
        });
      }
      card.appendChild(svg);

      var meta = document.createElement('div'); meta.className='progmeta';
      meta.textContent = fmtLabel(first.date)+': '+first.weight+'×'+first.reps+'  →  '+fmtLabel(lastPt.date)+': '+lastPt.weight+'×'+lastPt.reps;
      card.appendChild(meta);

      pl.appendChild(card);
    });
  }

  populateExerciseSelect();
  loadDate(currentDate);
})();
</script>
</body>
</html>
